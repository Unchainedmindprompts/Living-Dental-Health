<svg xmlns="http://www.w3.org/2000/svg" width="800" height="915" viewBox="0 0 800 915" role="img" aria-labelledby="title desc"><title id="title">Where dental cleanings work</title><desc id="desc">Different needs. Different types of care.</desc><rect x="0" y="0" width="800" height="915" rx="0" fill="#f4f1ea"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="19" fill="#596950">LIVING DENTAL HEALTH</text><text x="42" y="122" font-family="Georgia, serif" font-size="40" fill="#343b35">Where dental cleanings work</text><text x="42" y="169" font-family="Arial, sans-serif" font-size="25" fill="#343b35">Different needs. Different types of care.</text><rect x="41" y="214" width="348" height="390" rx="18" fill="#ffffff"/><text x="63" y="260" font-family="Arial, sans-serif" font-size="32" fill="#343b35">Regular cleaning</text><rect x="72" y="376" width="286" height="178" rx="6" fill="#efd8ce"/><path d="M 157 377 Q 152 293 187 295 Q 215 306 243 295 Q 278 293 273 377 L 240 524 Q 231 553 222 489 Q 215 464 208 489 Q 199 553 190 524 Z" fill="#fffdfa" stroke="#738075" stroke-width="4"/><path d="M 152 340 L 154 382 M 278 340 L 276 382" fill="none" stroke="#8c9c55" stroke-width="12" stroke-linecap="round"/><text x="68" y="580" font-family="Arial, sans-serif" font-size="23" fill="#343b35">Gumline</text><path d="M 168 574 L 115 378" stroke="#738075" stroke-width="2" fill="none"/><rect x="411" y="214" width="348" height="390" rx="18" fill="#ffffff"/><text x="433" y="260" font-family="Arial, sans-serif" font-size="32" fill="#343b35">Deep cleaning</text><rect x="442" y="376" width="286" height="178" rx="6" fill="#efd8ce"/><path d="M 527 377 Q 522 293 557 295 Q 585 306 613 295 Q 648 293 643 377 L 610 524 Q 601 553 592 489 Q 585 464 578 489 Q 569 553 560 524 Z" fill="#fffdfa" stroke="#738075" stroke-width="4"/><path d="M 526 340 L 526 380 L 551 493 M 644 340 L 644 380 L 619 493" fill="none" stroke="#8c9c55" stroke-width="12" stroke-linecap="round"/><text x="438" y="580" font-family="Arial, sans-serif" font-size="23" fill="#343b35">Gumline</text><path d="M 538 574 L 485 378" stroke="#738075" stroke-width="2" fill="none"/><text x="42" y="660" font-family="Arial, sans-serif" font-size="28" fill="#343b35">Regular: preventive cleaning for healthy gums.</text><text x="42" y="704" font-family="Arial, sans-serif" font-size="28" fill="#343b35">Deep: treats periodontitis below the gumline</text><text x="42" y="744" font-family="Arial, sans-serif" font-size="28" fill="#343b35">and along affected root surfaces.</text><text x="42" y="801" font-family="Arial, sans-serif" font-size="23" fill="#343b35">Green marks the focus of cleaning. Simplified illustration.</text><text x="42" y="840" font-family="Arial, sans-serif" font-size="23" fill="#343b35">Your examination determines the type of care needed.</text><text x="42" y="885" font-family="Arial, sans-serif" font-size="18" fill="#596950">PATIENT GUIDE  /  livingdentalhealth.com</text></svg>