<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc"><title id="title">Two ways to replace a tooth</title><desc id="desc">The key difference is what supports the new tooth.</desc><rect x="0" y="0" width="800" height="900" rx="0" fill="#f4f1ea"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="19" fill="#596950">LIVING DENTAL HEALTH</text><text x="42" y="122" font-family="Georgia, serif" font-size="40" fill="#343b35">Two ways to replace a tooth</text><text x="42" y="169" font-family="Arial, sans-serif" font-size="25" fill="#343b35">The key difference is what supports the new tooth.</text><rect x="41" y="214" width="348" height="410" rx="18" fill="#ffffff"/><text x="61" y="264" font-family="Arial, sans-serif" font-size="31" fill="#343b35">Single implant</text><rect x="64" y="415" width="302" height="161" rx="6" fill="#e7d8bd"/><rect x="64" y="390" width="302" height="34" rx="5" fill="#dfb8a9"/><path d="M 92 388 L 105 549 Q 116 568 127 549 L 140 388 Z" fill="#fffdfa" stroke="#738075" stroke-width="3"/><rect x="84" y="323" width="64" height="75" rx="15" fill="#fffdfa"/><path d="M 290 388 L 303 549 Q 314 568 325 549 L 338 388 Z" fill="#fffdfa" stroke="#738075" stroke-width="3"/><rect x="282" y="323" width="64" height="75" rx="15" fill="#fffdfa"/><rect x="190" y="414" width="50" height="136" rx="8" fill="#9daab0"/><path d="M 186 430 l 58 -10" stroke="#5e7079" stroke-width="5"/><path d="M 186 447 l 58 -10" stroke="#5e7079" stroke-width="5"/><path d="M 186 464 l 58 -10" stroke="#5e7079" stroke-width="5"/><path d="M 186 481 l 58 -10" stroke="#5e7079" stroke-width="5"/><path d="M 186 498 l 58 -10" stroke="#5e7079" stroke-width="5"/><path d="M 186 515 l 58 -10" stroke="#5e7079" stroke-width="5"/><path d="M 186 532 l 58 -10" stroke="#5e7079" stroke-width="5"/><rect x="202" y="375" width="26" height="46" rx="4" fill="#697d84"/><rect x="180" y="319" width="70" height="72" rx="16" fill="#e4eadf"/><rect x="411" y="214" width="348" height="410" rx="18" fill="#ffffff"/><text x="431" y="264" font-family="Arial, sans-serif" font-size="31" fill="#343b35">Traditional bridge</text><rect x="434" y="415" width="302" height="161" rx="6" fill="#e7d8bd"/><rect x="434" y="390" width="302" height="34" rx="5" fill="#dfb8a9"/><path d="M 464 361 L 473 548 Q 485 567 497 548 L 506 361 Z" fill="#fffdfa" stroke="#738075" stroke-width="3"/><path d="M 664 361 L 673 548 Q 685 567 697 548 L 706 361 Z" fill="#fffdfa" stroke="#738075" stroke-width="3"/><rect x="476" y="346" width="218" height="23" rx="4" fill="#8b9b80"/><rect x="447" y="316" width="76" height="77" rx="15" fill="#e4eadf"/><rect x="547" y="316" width="76" height="77" rx="15" fill="#e4eadf"/><rect x="647" y="316" width="76" height="77" rx="15" fill="#e4eadf"/><text x="42" y="679" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Implant: support from an implant in the jawbone.</text><text x="42" y="725" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Bridge: support from crowned neighboring teeth.</text><text x="42" y="771" font-family="Arial, sans-serif" font-size="27" fill="#343b35">The middle bridge tooth has no natural root.</text><text x="42" y="827" font-family="Arial, sans-serif" font-size="22" fill="#343b35">Simplified illustration, not to scale. Other bridge types differ.</text><text x="42" y="870" font-family="Arial, sans-serif" font-size="18" fill="#596950">PATIENT GUIDE  /  livingdentalhealth.com</text></svg>