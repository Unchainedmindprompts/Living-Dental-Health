<svg xmlns="http://www.w3.org/2000/svg" width="800" height="845" viewBox="0 0 800 845" role="img" aria-labelledby="title desc"><title id="title">A calmer dental visit</title><desc id="desc">Start with a conversation about your comfort.</desc><rect x="0" y="0" width="800" height="845" rx="0" fill="#f4f1ea"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="19" fill="#596950">LIVING DENTAL HEALTH</text><text x="42" y="122" font-family="Georgia, serif" font-size="40" fill="#343b35">A calmer dental visit</text><text x="42" y="169" font-family="Arial, sans-serif" font-size="25" fill="#343b35">Start with a conversation about your comfort.</text><rect x="32" y="215" width="736" height="164" rx="18" fill="#ffffff"/><circle cx="89" cy="269" r="29" fill="#e4eadf"/><text x="70" y="279" font-family="Arial, sans-serif" font-size="27" fill="#343b35">01</text><text x="140" y="269" font-family="Arial, sans-serif" font-size="32" fill="#343b35">Tell us what worries you</text><text x="140" y="314" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Share past experiences, discomfort,</text><text x="140" y="350" font-family="Arial, sans-serif" font-size="27" fill="#343b35">or the parts of a visit you find difficult.</text><rect x="32" y="405" width="736" height="164" rx="18" fill="#ffffff"/><circle cx="89" cy="459" r="29" fill="#e4eadf"/><text x="70" y="469" font-family="Arial, sans-serif" font-size="27" fill="#343b35">02</text><text x="140" y="459" font-family="Arial, sans-serif" font-size="32" fill="#343b35">Agree on a pause signal</text><text x="140" y="504" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Choose a hand signal with your dentist</text><text x="140" y="540" font-family="Arial, sans-serif" font-size="27" fill="#343b35">so you can ask for a break.</text><rect x="32" y="595" width="736" height="164" rx="18" fill="#ffffff"/><circle cx="89" cy="649" r="29" fill="#e4eadf"/><text x="70" y="659" font-family="Arial, sans-serif" font-size="27" fill="#343b35">03</text><text x="140" y="649" font-family="Arial, sans-serif" font-size="32" fill="#343b35">Ask what happens next</text><text x="140" y="694" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Discuss each step and your comfort</text><text x="140" y="730" font-family="Arial, sans-serif" font-size="27" fill="#343b35">options before treatment begins.</text><text x="42" y="815" font-family="Arial, sans-serif" font-size="18" fill="#596950">PATIENT GUIDE  /  livingdentalhealth.com</text></svg>