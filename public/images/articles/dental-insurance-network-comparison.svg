<svg xmlns="http://www.w3.org/2000/svg" width="800" height="860" viewBox="0 0 800 860" role="img" aria-labelledby="title desc"><title id="title">Understand your dental benefits</title><desc id="desc">Network status alone does not tell you the final cost.</desc><rect x="0" y="0" width="800" height="860" rx="0" fill="#f4f1ea"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="19" fill="#596950">LIVING DENTAL HEALTH</text><text x="42" y="122" font-family="Georgia, serif" font-size="40" fill="#343b35">Understand your dental benefits</text><text x="42" y="169" font-family="Arial, sans-serif" font-size="25" fill="#343b35">Network status alone does not tell you the final cost.</text><rect x="32" y="215" width="736" height="165" rx="18" fill="#ffffff"/><rect x="32" y="215" width="8" height="165" rx="0" fill="#819171"/><text x="60" y="267" font-family="Arial, sans-serif" font-size="35" fill="#343b35">In-network</text><text x="60" y="313" font-family="Arial, sans-serif" font-size="27" fill="#343b35">The dentist has a contract with your plan.</text><text x="60" y="351" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Contract terms affect covered-service fees.</text><rect x="32" y="410" width="736" height="165" rx="18" fill="#ffffff"/><rect x="32" y="410" width="8" height="165" rx="0" fill="#819171"/><text x="60" y="462" font-family="Arial, sans-serif" font-size="35" fill="#343b35">Out-of-network</text><text x="60" y="508" font-family="Arial, sans-serif" font-size="27" fill="#343b35">The dentist has no contract with your plan.</text><text x="60" y="546" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Benefits and your share depend on the plan.</text><rect x="32" y="615" width="736" height="174" rx="18" fill="#e4eadf"/><text x="60" y="660" font-family="Arial, sans-serif" font-size="32" fill="#343b35">Before you book, check:</text><text x="60" y="705" font-family="Arial, sans-serif" font-size="28" fill="#343b35">Network status • covered services</text><text x="60" y="747" font-family="Arial, sans-serif" font-size="27" fill="#343b35">Deductible • annual maximum • estimated cost</text><text x="42" y="830" font-family="Arial, sans-serif" font-size="18" fill="#596950">PATIENT GUIDE  /  livingdentalhealth.com</text></svg>